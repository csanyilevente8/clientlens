# ClientLens local development stack.
# One command to start the core system (SPEC §36): `docker compose up`.
# This phase includes MySQL + backend. Frontend, Kafka, pgvector, mock-crm are added
# in later phases.

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: clientlens
      MYSQL_USER: clientlens
      MYSQL_PASSWORD: clientlens
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infrastructure/docker/mysql-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: clientlens
      DB_PASSWORD: clientlens
      DB_NAME: clientlens
      ENVIRONMENT: docker
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
