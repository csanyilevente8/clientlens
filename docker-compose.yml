# ClientLens local development stack.
# One command to start the core system (SPEC §36): `docker compose up`.
# This phase includes MySQL + backend. Frontend, Kafka, pgvector, mock-crm are added
# in later phases.

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: clientlens
      MYSQL_USER: clientlens
      MYSQL_PASSWORD: clientlens
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infrastructure/docker/mysql-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: clientlens
      DB_PASSWORD: clientlens
      DB_NAME: clientlens
      ENVIRONMENT: docker
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

  # Outbox publisher: drains outbox_events -> Kafka. Independently deployable (§37).
  publisher:
    build:
      context: ./backend
    command: ["uv", "run", "python", "-m", "app.workers.run_publisher"]
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: clientlens
      DB_PASSWORD: clientlens
      DB_NAME: clientlens
      ENVIRONMENT: docker
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      mysql:
        condition: service_healthy

  # AI worker: consumes meeting.created -> analyzes -> persists intelligence. Scaled
  # independently from the API (different workload) — SYSTEMDESING §14/§38.
  ai-worker:
    build:
      context: ./backend
    command: ["uv", "run", "python", "-m", "app.workers.ai_worker"]
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: clientlens
      DB_PASSWORD: clientlens
      DB_NAME: clientlens
      ENVIRONMENT: docker
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      LLM_PROVIDER: mock
    depends_on:
      mysql:
        condition: service_healthy

  kafka:
    image: apache/kafka:3.8.0
    environment:
      # KRaft mode (no Zookeeper): this single node is both broker and controller.
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data

  # Separate vector store for semantic search (ADR-004): Postgres + pgvector, distinct
  # from MySQL (the transactional source of truth).
  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: clientlens
      POSTGRES_PASSWORD: clientlens
      POSTGRES_DB: clientlens_vectors
    ports:
      - "5433:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      - ./infrastructure/docker/pgvector-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clientlens -d clientlens_vectors"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
  kafka_data:
  pgvector_data:
